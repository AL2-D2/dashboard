<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>

<body>
    <div class="main-container">
    <div class="sidebar-nav">
        <div class="dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" viewBox="0 0 24 24">
                <title>alphabet-piqad</title>
                <path
                    d="M13.04 4L6.54 17.85C6.21 18.55 5.5 19 4.73 19H4V20H16C17.2 20 18.27 20.54 19 21.39H20C19.05 19.32 17 18 14.7 18H12C11.29 18 10.62 17.63 10.24 17.03C9.85 16.43 9.8 15.68 10.1 15.03L10.58 14H19V13H17.5C15.29 13 13.5 11.21 13.5 9C13.5 6.79 15.29 5 17.5 5H20V4Z" />
            </svg>
            <h1>Dashboard</h1>
        </div>

        <div class="main-interactions">
            <div class="home"><svg width="50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>home</title>
                    <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
                </svg>
                <h2>Home</h2>
            </div>
            <div class="profile">
                <svg width="50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>account</title><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" /></svg>                
            <h2>Profile</h2></div>
            <div class="messages">
                <svg width="50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>message</title><path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4C22,2.89 21.1,2 20,2Z" /></svg>
                <h2>Messages</h2>
            </div>
            <div class="history"><h2>History</h2></div>
            <div class="tasks"><h2>Tasks</h2></div>
            <div class="communities"><h2>Communities</h2></div>
        </div>
        <div class="support-interactions">
            <div class="settings"><h2>Settings</h2></div>
            <div class="support"><h2>Support</h2></div>
            <div class="privacy"><h2>Privacy</h2></div>
        </div>
    </div>
    <div class="container">
        <div class="top-content"></div>
        <div class="main-content">
            <div class="projects"></div>
            <div class="announcements"></div>
            <div class="trending"></div>
        </div>

    </div>
    </div>
</body>

</html>
